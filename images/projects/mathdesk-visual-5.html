<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture Animation</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .diagram-container {
            position: relative;
            width: 900px;
            height: 450px;
        }

        /* Box Styles */
        .box {
            position: absolute;
            width: 180px;
            height: 120px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* FIXED: Base state is now visible so they don't disappear */
            opacity: 1; 
            transform: translateY(0);
        }

        /* The initial fade-in animation class */
        .box.fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s forwards;
        }

        .box h3 {
            margin: 10px 0 0 0;
            color: #1e293b;
            font-size: 18px;
            font-weight: 700;
        }

        .box svg {
            width: 40px;
            height: 40px;
            stroke: #3b82f6;
            stroke-width: 2;
            fill: none;
        }

        /* Box Positions & Animation Delays */
        .frontend { top: 80px; left: 40px; animation-delay: 0.2s; }
        .n8n { top: 80px; left: 360px; animation-delay: 0.8s; }
        .groq { top: 80px; left: 680px; animation-delay: 1.4s; }
        .supabase { top: 280px; left: 360px; animation-delay: 2.0s; }

        /* Arrow Styles */
        svg.arrows {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .arrow-line {
            fill: none;
            stroke: #94a3b8;
            stroke-width: 2;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawArrow 1s forwards;
        }

        .arrow-head {
            fill: #94a3b8;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        /* Animated Data Flow */
        .data-flow {
            fill: none;
            stroke: #3b82f6;
            stroke-width: 3;
            stroke-dasharray: 10 15;
            stroke-dashoffset: 0;
            opacity: 0;
            animation: dashMove 1s linear infinite, fadeIn 0.5s forwards;
        }

        /* Animation Delays for Arrows */
        .arrow-1 { animation-delay: 0.5s; }
        .arrow-1-head { animation-delay: 1.2s; }
        .flow-1 { animation-delay: 1.5s; }

        .arrow-2 { animation-delay: 1.1s; }
        .arrow-2-head { animation-delay: 1.8s; }
        .flow-2 { animation-delay: 2.1s; }

        .arrow-3 { animation-delay: 1.7s; }
        .arrow-3-head { animation-delay: 2.4s; }
        .flow-3 { animation-delay: 2.7s; }

        /* Keyframe Animations */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes drawArrow {
            to { stroke-dashoffset: 0; }
        }

        @keyframes dashMove {
            to { stroke-dashoffset: -25; }
        }

        /* Pulse animation on boxes */
        .pulse {
            animation: pulseBox 1s ease-out;
        }

        @keyframes pulseBox {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body>

    <div class="diagram-container">
        <!-- SVG Overlay for Arrows -->
        <svg class="arrows">
            <!-- Frontend to n8n -->
            <path class="arrow-line arrow-1" d="M 220 140 L 350 140" />
            <polygon class="arrow-head arrow-1-head" points="350,135 360,140 350,145" />
            <path class="data-flow flow-1" d="M 220 140 L 350 140" />

            <!-- n8n to Groq -->
            <path class="arrow-line arrow-2" d="M 540 140 L 670 140" />
            <polygon class="arrow-head arrow-2-head" points="670,135 680,140 670,145" />
            <path class="data-flow flow-2" d="M 540 140 L 670 140" />

            <!-- n8n to Supabase -->
            <path class="arrow-line arrow-3" d="M 450 200 L 450 270" />
            <polygon class="arrow-head arrow-3-head" points="445,270 450,280 455,270" />
            <path class="data-flow flow-3" d="M 450 200 L 450 270" />
            
            <!-- Data Storage Label -->
            <text x="460" y="245" font-family="sans-serif" font-size="12" fill="#64748b" opacity="0" class="arrow-3-head" style="animation-delay: 2.5s;">Data Storage</text>
        </svg>

        <!-- Frontend Box -->
        <div class="box frontend fade-in" id="box-frontend">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <h3>Frontend</h3>
        </div>

        <!-- n8n Box -->
        <div class="box n8n fade-in" id="box-n8n">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <h3>n8n</h3>
        </div>

        <!-- Groq Box -->
        <div class="box groq fade-in" id="box-groq">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                <rect x="9" y="9" width="6" height="6"></rect>
                <line x1="9" y1="1" x2="9" y2="4"></line>
                <line x1="15" y1="1" x2="15" y2="4"></line>
                <line x1="9" y1="20" x2="9" y2="23"></line>
                <line x1="15" y1="20" x2="15" y2="23"></line>
                <line x1="20" y1="9" x2="23" y2="9"></line>
                <line x1="20" y1="14" x2="23" y2="14"></line>
                <line x1="1" y1="9" x2="4" y2="9"></line>
                <line x1="1" y1="14" x2="4" y2="14"></line>
            </svg>
            <h3>Groq</h3>
        </div>

        <!-- Supabase Box -->
        <div class="box supabase fade-in" id="box-supabase">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
            <h3>Supabase</h3>
        </div>
    </div>

    <script>
        // Add a pulse effect to the boxes when the "data" arrives
        // Because the base .box is now opacity: 1, overriding the animation with .pulse
        // will not cause them to disappear!
        setTimeout(() => document.getElementById('box-n8n').classList.add('pulse'), 1500);
        setTimeout(() => document.getElementById('box-groq').classList.add('pulse'), 2100);
        setTimeout(() => document.getElementById('box-supabase').classList.add('pulse'), 2700);
    </script>
</body>
</html>
