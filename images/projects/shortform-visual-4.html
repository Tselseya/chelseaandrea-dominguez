<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture Animation</title>
    <style>
        /* ==========================================
           VARIABLES & RESET
           ========================================== */
        :root {
            --bg: #0a0a0f;
            --box-bg: #13141a;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --purple: #a855f7;
            --blue: #3b82f6;
            --purple-glow: rgba(168, 85, 247, 0.3);
            --blue-glow: rgba(59, 130, 246, 0.3);
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ==========================================
           LAYOUT
           ========================================== */
        .diagram-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            padding: 40px;
            gap: 40px;
            position: relative;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        /* ==========================================
           BOX STYLES
           ========================================== */
        .box {
            background: var(--box-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px 40px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            position: relative;
        }

        .box.top {
            color: var(--text-main);
            border-color: rgba(168, 85, 247, 0.3);
            box-shadow: 0 0 15px var(--purple-glow), inset 0 0 15px rgba(168, 85, 247, 0.05);
        }

        .box.bottom {
            color: var(--text-main);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 15px var(--blue-glow), inset 0 0 15px rgba(59, 130, 246, 0.05);
        }

        /* ==========================================
           ARROW STYLES (Horizontal)
           ========================================== */
        .arrow {
            width: 40px;
            height: 2px;
            position: relative;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: left;
            animation: drawArrow 0.4s ease-out forwards;
        }

        .arrow::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4px;
            border-left: 8px solid transparent;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }

        .arrow.top-arrow {
            background: var(--purple);
        }
        .arrow.top-arrow::after {
            border-left-color: var(--purple);
        }

        .arrow.bottom-arrow {
            background: var(--blue);
        }
        .arrow.bottom-arrow::after {
            border-left-color: var(--blue);
        }

        /* ==========================================
           VERTICAL CONNECTOR
           ========================================== */
        .vertical-connector {
            width: 2px;
            height: 80px;
            background: var(--text-muted);
            position: relative;
            opacity: 0;
            transform: scaleY(0);
            transform-origin: top;
            animation: drawLine 0.6s ease-out forwards;
            animation-delay: 2.4s;
            margin: -20px 0; /* Pull closer to the rows */
        }

        .vertical-connector::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: -4px;
            border-top: 8px solid var(--text-muted);
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
        }

        /* ==========================================
           FOOTER
           ========================================== */
        .footer {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
            animation-delay: 4.5s;
            display: flex;
            gap: 10px;
        }
        
        .footer span.arrow-text {
            color: var(--blue);
        }

        /* ==========================================
           KEYFRAMES
           ========================================== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes drawArrow {
            from { opacity: 0; transform: scaleX(0); }
            to { opacity: 1; transform: scaleX(1); }
        }

        @keyframes drawLine {
            from { opacity: 0; transform: scaleY(0); }
            to { opacity: 1; transform: scaleY(1); }
        }

        /* ==========================================
           ANIMATION DELAYS (Staggered Sequence)
           ========================================== */
        
        /* Top Row Boxes */
        .row.top-row .box:nth-child(1) { animation-delay: 0.2s; } /* EXTRACT */
        .row.top-row .box:nth-child(3) { animation-delay: 0.6s; } /* SCRIPT */
        .row.top-row .box:nth-child(5) { animation-delay: 1.0s; } /* CAPTION */
        .row.top-row .box:nth-child(7) { animation-delay: 1.4s; } /* CTA */
        .row.top-row .box:nth-child(9) { animation-delay: 1.8s; } /* HASHTAGS */

        /* Top Row Arrows */
        .row.top-row .arrow:nth-child(2) { animation-delay: 0.4s; }
        .row.top-row .arrow:nth-child(4) { animation-delay: 0.8s; }
        .row.top-row .arrow:nth-child(6) { animation-delay: 1.2s; }
        .row.top-row .arrow:nth-child(8) { animation-delay: 1.6s; }

        /* Bottom Row Boxes */
        .row.bottom-row .box:nth-child(1) { animation-delay: 3.0s; } /* INTAKE */
        .row.bottom-row .box:nth-child(3) { animation-delay: 3.4s; } /* GENERATION */
        .row.bottom-row .box:nth-child(5) { animation-delay: 3.8s; } /* APPROVAL */
        .row.bottom-row .box:nth-child(7) { animation-delay: 4.2s; } /* DISTRIBUTION */

        /* Bottom Row Arrows */
        .row.bottom-row .arrow:nth-child(2) { animation-delay: 3.2s; }
        .row.bottom-row .arrow:nth-child(4) { animation-delay: 3.6s; }
        .row.bottom-row .arrow:nth-child(6) { animation-delay: 4.0s; }

        /* ==========================================
           REDUCED MOTION SAFETY
           ========================================== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="diagram-container">
        
        <!-- Top Row -->
        <div class="row top-row">
            <div class="box top">EXTRACT</div>
            <div class="arrow top-arrow"></div>
            
            <div class="box top">SCRIPT</div>
            <div class="arrow top-arrow"></div>
            
            <div class="box top">CAPTION</div>
            <div class="arrow top-arrow"></div>
            
            <div class="box top">CTA</div>
            <div class="arrow top-arrow"></div>
            
            <div class="box top">HASHTAGS</div>
        </div>

        <!-- Vertical Connector -->
        <div class="vertical-connector"></div>

        <!-- Bottom Row -->
        <div class="row bottom-row">
            <div class="box bottom">INTAKE</div>
            <div class="arrow bottom-arrow"></div>
            
            <div class="box bottom">GENERATION</div>
            <div class="arrow bottom-arrow"></div>
            
            <div class="box bottom">APPROVAL</div>
            <div class="arrow bottom-arrow"></div>
            
            <div class="box bottom">DISTRIBUTION</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>EXPERIMENT</span>
            <span class="arrow-text">→</span>
            <span>INFORMS</span>
            <span class="arrow-text">→</span>
            <span>ARCHITECTURE</span>
        </div>

    </div>

    <script>
        // Restart the animation loop every 6.5 seconds
        setInterval(() => {
            const container = document.querySelector('.diagram-container');
            const clone = container.cloneNode(true);
            container.parentNode.replaceChild(clone, container);
        }, 6500);
    </script>
</body>
</html>
